<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
</head>
<body>
<meta charset="utf-8">
<title>Meteorite Kids Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one arcade cabinet column. Pixel stage on top; below it either the chapter menu or the battle deck (status cards, commands, log). Committed dark look. */
:root{
  --bg:#0d0b1a; --panel:#17142b; --panel2:#201c3a; --line:#322b5c;
  --fg:#ece8ff; --muted:#9a93c4; --accent:#ffcc33; --danger:#ff4d6d; --good:#4ff2b0;
  --display:"Pixelify Sans", "Courier New", monospace;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
.dlg.top{top:8px;bottom:auto}.screen.dlgtop .skip{top:auto;bottom:6px}
.hub-banner,.hub-saved{position:absolute;top:2.5%;background:rgba(10,14,40,.82);color:#fff;font-family:var(--display);font-size:clamp(12px,2.1vw,17px);line-height:1;padding:.35em .6em;border-radius:3px;pointer-events:none;z-index:2;white-space:nowrap}.hub-banner{left:1.6%}
.banter{position:absolute;left:1.6%;bottom:3.5%;max-width:66%;background:rgba(10,14,40,.84);color:#fff;font-family:var(--display);font-size:clamp(11px,1.9vw,15px);line-height:1.3;padding:.4em .7em;border-radius:4px;border-left:3px solid #7ac8ff;pointer-events:none;z-index:2}
.banter b{margin-right:.45em}.hub-saved{right:1.6%;border-left:4px solid #7ac8ff}
.goal{margin:0 0 6px;padding:6px 10px;border-left:4px solid #ffcc33;background:rgba(255,204,51,.08);color:var(--fg)}.goal strong{color:#ffcc33}.dlg-q{display:block;margin-bottom:6px}.dlg-opts{display:flex;gap:10px;flex-wrap:wrap}.dlg-opt{font:inherit;font-size:.9em;color:#fff;background:rgba(10,14,60,.6);border:2px solid rgba(232,236,255,.5);border-radius:4px;padding:2px 12px;cursor:pointer;pointer-events:auto}.dlg-opt.on{border-color:#ffcc33;color:#ffcc33;background:rgba(255,204,51,.12)}.dlg-opt.on::before{content:'\25B6  '}
.tq-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 8px;font-size:13px}.tq-label{color:var(--muted);margin-right:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}.tq{border:1px solid var(--c,#9fc0ff);color:var(--fg);border-left:4px solid var(--c,#9fc0ff);padding:2px 7px;border-radius:4px;background:#14102a;white-space:nowrap}.tq.boss{--c:#ff4d6d;color:#ffb0bc}.tq.now{background:var(--c,#9fc0ff);color:#0c0a1a;font-weight:700}.tq.skip{opacity:.45;text-decoration:line-through}.tq.mine{outline:2px dashed #ffcc33;outline-offset:1px}.tq.warn{background:#5a1020;color:#ffd0d8;border-color:#ff4d6d;animation:telePulse 1s ease-in-out infinite}.chip.tele{animation:telePulse 1s ease-in-out infinite;font-weight:700}@keyframes telePulse{50%{box-shadow:0 0 0 3px rgba(255,77,109,.45)}}.tq-arrow{color:var(--muted)}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,4,16,.72);z-index:20}.modal-box{background:var(--panel,#16122a);border:2px solid var(--accent);border-radius:8px;padding:16px 18px;width:min(88%,420px)}.modal-box h2{margin:0 0 6px}.modal-box p{margin:0 0 12px}
.slots{display:grid;gap:8px;margin:8px 0}.slots .slot{text-align:left;width:100%}.slots .slot small{display:block}.slots .slot.empty{opacity:.75}
.tut{margin:0 0 10px;padding:10px 14px;border:2px solid var(--accent);border-radius:6px;background:rgba(255,204,51,.08);font-size:15px;line-height:1.45}.tut b{color:var(--accent);font-family:var(--display);display:block;font-size:12px;letter-spacing:.08em;margin-bottom:2px}
.chlist button.locked{opacity:.45;cursor:not-allowed;border-style:dashed}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 32px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.5vw,32px);letter-spacing:.04em;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.chapter{font-family:var(--display);color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.screen{position:relative;border:3px solid var(--line);border-radius:4px;background:#000;overflow:hidden}
.dlg{position:absolute;left:8px;right:8px;bottom:8px;background:linear-gradient(180deg,#2c3c9e,#141c64);border:2px solid #e8ecff;border-radius:6px;box-shadow:0 0 0 2px #0a0c28,inset 0 0 0 1px rgba(255,255,255,.15);padding:8px 28px 10px 12px;color:#ffffff;font-family:var(--display);font-size:clamp(13px,2.4vw,18px);line-height:1.35;min-height:3.4em;cursor:pointer}
.dlg-name{font-weight:700;font-size:.9em;margin-bottom:2px;letter-spacing:.04em}
.dlg-next{position:absolute;right:10px;bottom:6px;font-size:.7em;color:#ffffff;animation:mkblink 1s steps(2) infinite}
.cap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(82%,540px);text-align:center;font-family:var(--display);font-size:clamp(14px,2.7vw,20px);color:#ffe9a8;text-shadow:2px 2px 0 #000000;line-height:1.4;pointer-events:none;background:rgba(10,8,28,.72);padding:8px 14px;border-radius:6px}
.skip{position:absolute;top:6px;right:6px;opacity:.85}
@keyframes mkblink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.dlg-next{animation:none}}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:256/144;max-width:100%}
.panel{background:var(--panel);border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-family:var(--display);font-size:clamp(20px,4vw,26px);margin:0;color:var(--accent);letter-spacing:.04em;text-wrap:balance}
.panel p{margin:0;max-width:68ch}
.panel .tip{color:var(--muted);font-size:14px}
.chlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.status{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--panel);border:2px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card.active{border-color:var(--accent)}
.card.bench{border-style:dashed}
.card.down{opacity:.5}
.card .nm{font-family:var(--display);font-size:17px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.card .nm small{font-family:var(--body);font-size:10px;color:var(--muted);font-weight:400;align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .nm{flex-wrap:nowrap;align-items:center;font-size:14px;letter-spacing:-.3px}.card .nm>span{white-space:nowrap;flex-shrink:0}
@media (max-width:760px){.card .nm{font-size:12.5px}.card .nm small{font-size:9.5px}}
.form{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.form.pow{color:var(--accent)}
.bar{height:8px;background:#000;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);transition:width .3s}
.bar.boss i{background:var(--danger)}
.hp{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);letter-spacing:.03em}
.chip.warn{border-color:var(--danger);color:var(--danger)}
.chip.ok{border-color:var(--good);color:var(--good)}
.deck{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
@media (max-width:640px){.deck{grid-template-columns:1fr}}
.cmds{background:var(--panel);border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cmds .who{font-family:var(--display);font-size:16px;color:var(--accent)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
button{font-family:var(--display);font-size:15px;font-weight:600;background:var(--panel2);color:var(--fg);border:2px solid var(--line);padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
button small{font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);line-height:1.3}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1300;border-color:var(--accent);align-self:flex-start}
button.special{border-color:var(--accent)}
.log{background:var(--panel);border:2px solid var(--line);padding:10px;font-size:13px;display:flex;flex-direction:column;gap:3px;min-height:120px;min-width:0}
.log div{color:var(--muted)}
.log div:last-child{color:var(--fg)}

.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.padstat{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 8px}
.padstat.ok{color:var(--good);border-color:var(--good)}
button.mini{font-size:13px;padding:4px 10px;align-items:center}
.vol{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.vol input{width:80px;accent-color:var(--accent);cursor:pointer}
button.pad-focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);outline:none}
.controls{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.sbook{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0}
.sbk{background:#efe6cf;color:#2a2418;border-radius:4px;padding:10px 12px;box-shadow:0 2px 0 #0006;position:relative;font-size:14px;line-height:1.35}
.sbk h4{font-family:Georgia,'Times New Roman',serif;font-size:15px;margin:2px 0 6px;letter-spacing:.3px;text-transform:uppercase;border-bottom:1px solid #2a241866;padding-bottom:4px}
.sbk p{margin:4px 0;font-family:Georgia,'Times New Roman',serif}
.sbk .sbk-paper{display:block;font-family:Georgia,serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6a5a3a}
.sbk .sbk-where{display:block;margin-top:6px;font-size:11px;color:#7a6a4a}
.sbk .hand{font-family:Caveat,'Segoe Print','Comic Sans MS',cursive;font-size:19px;line-height:1.15;color:#1f2f6a}
.sbk .sign{text-align:right}
.sbk.journal{background:repeating-linear-gradient(#f6f0de 0 21px,#c9d4e8 21px 22px)}
.sbk.ticket{background:#f3ddb0;border:1px dashed #8a6a3a}
.sbk.shaky .hand{transform:rotate(-.6deg);letter-spacing:.4px;color:#33305a}
.sbk.crimson .hand{color:#9a1a1a}
.sbk .letter{font-size:13px;border-top:1px dotted #2a241866;padding-top:4px}
.sbk.memory{background:radial-gradient(circle at 80% 15%,#3a4a8a,#141a3a 70%);color:#e8ecff;border:1px solid #6a7ac8}
.sbk.memory p{font-style:italic;font-family:Georgia,serif}.sbk.memory .sbk-paper,.sbk.memory .sbk-where{color:#aab4e8}
.sbk.miss{background:#1a1630;color:var(--muted);border:1px dashed #3a3360;box-shadow:none}
.sbk.miss b{font-size:18px;color:#6a6390}
.sbk.miss small{display:block;margin-top:4px}

.mm{display:flex;align-items:center;gap:4px;margin:3px 0 2px;font-size:11px;color:var(--muted)}
.mm-lbl{min-width:66px;text-transform:uppercase;letter-spacing:.4px}.mm-lbl.on{color:#ffcc33}.mm-lbl.ready{color:#7af0c8}
.mm-pip{width:14px;height:7px;border-radius:2px;background:#2a2440;border:1px solid #4a4270}.mm-pip.on{background:#ffcc33;border-color:#fff0a0;box-shadow:0 0 4px #ffcc33aa}
.mm-bar{flex:1;height:6px;background:#2a2440;border-radius:3px;overflow:hidden;max-width:90px}.mm-bar i{display:block;height:100%;background:#6a7ab8}
.mm-bar.ready i{background:#7af0c8;animation:mmglow 1.4s ease-in-out infinite}.mm-n{color:#c8d0dc}
@keyframes mmglow{50%{opacity:.55}}

#diffBody button.primary small{color:#4a3600;opacity:1}
#xferBody textarea{width:100%;min-height:90px;font:12px monospace;background:var(--panel2);color:var(--fg);border:2px solid var(--line);border-radius:4px;padding:6px;box-sizing:border-box;word-break:break-all}
#xferBody h3{margin:12px 0 4px;font-size:15px}

/* Phones: keep the battle commands right under the screen, and slim the header */
@media (max-width:640px){
  #battleUI:not([hidden]){display:flex;flex-direction:column}
  #battleUI #tut{order:0}#battleUI #turnOrder{order:1}#battleUI .deck{order:2;margin-top:0!important;margin-bottom:10px}#battleUI #status{order:3}
  .tq-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tq-row::-webkit-scrollbar{display:none}.tq-row>*{flex:0 0 auto}
  #padStatus{display:none}
  .hud{gap:6px}.hud .mini{padding:4px 7px;font-size:12px}.vol input{width:64px}
  .btns button{padding:7px 8px}.btns button small{font-size:11px}
  .log{min-height:0!important;max-height:96px;overflow-y:auto}
}
/* Phones sideways: fit the whole game screen in view */
@media (orientation:landscape) and (max-height:520px){.screen{max-width:calc(86vh * 16 / 9);margin-left:auto;margin-right:auto}h1{font-size:20px}#padStatus{display:none}}
#netHint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;background:rgba(10,8,20,.85);border:1px solid #7af0c8;color:#7af0c8;font-size:12px;padding:3px 10px;border-radius:4px;pointer-events:none;white-space:nowrap}
#netVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;image-rendering:pixelated;z-index:1}
#netBody p{margin:8px 0}#netBody input{font:inherit;padding:6px 8px;background:var(--panel2);color:var(--fg);border:2px solid var(--line);border-radius:4px}
.net-code{font-family:var(--display);font-size:34px;letter-spacing:6px;color:var(--accent);margin:6px 0}
.net-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}.net-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:4px}
.net-row select{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:3px}
.net-err{color:#ff8a9a}.net-on{border-color:#7af0c8!important;color:#7af0c8}
body.net-guest #menu button,body.net-guest #battleUI button{pointer-events:none;opacity:.55}
body.net-guest.net-myturn #btns button:not([disabled]){pointer-events:auto;opacity:1}
body.net-guest.net-myturn .cmds{outline:2px solid #7af0c8;outline-offset:4px;border-radius:4px}
body.net-guest #skipBtn,body.net-guest #exitBtn,body.net-guest #diffTop,body.net-guest #autoTop{display:none}
</style>

<div class="wrap">
  <header>
    <h1>THE <span>METEORITE</span> KIDS</h1>
    <div class="hud">
      <span class="chapter" id="chLabel">Part 1 · Ages 10 to 13</span>
      <span class="padstat" id="padStatus">No controller</span>
      <button class="mini" id="soundBtn" aria-pressed="true">Sound on</button>
      <label class="vol" title="Music volume">Music<input type="range" id="volMusic" min="0" max="100" step="5" aria-label="Music volume"></label>
      <label class="vol" title="Sound effects volume">Effects<input type="range" id="volSfx" min="0" max="100" step="5" aria-label="Sound effects volume"></label>
      <button class="mini diffBtn" id="diffTop" title="Change how tough battles are">Difficulty</button>
      <button class="mini autosaveBtn" id="autoTop" title="Save automatically after each chapter and room">Autosave</button>
      <button class="mini" id="netBtn" title="Play online with friends">Online</button>
      <button class="mini" id="manualBtn">Manual</button>
      <button class="mini" id="exitBtn" hidden>Exit</button>
    </div>
  </header>
  <div class="screen" id="screen"><canvas id="cv" width="512" height="288"></canvas><video id="netVideo" muted autoplay playsinline hidden></video><div id="netHint" hidden></div>
    <div class="modal" id="xferDlg" hidden><div class="modal-box" style="width:min(94%,600px)"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Move saves</h2><button id="xferX">Close</button></div><div id="xferBody"></div></div></div>
    <div class="modal" id="diffDlg" hidden><div class="modal-box" style="width:min(94%,520px)"><h2 style="margin:0 0 6px">Difficulty</h2><div id="diffBody"></div></div></div>
    <div class="modal" id="netDlg" hidden><div class="modal-box" style="width:min(94%,560px)"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Play Online</h2><button id="netX">Close</button></div><div class="row" style="margin:8px 0 4px"><button class="mini" id="netTabPlay">Play</button><button class="mini" id="netTabTips">Tips</button></div><div id="netBody"></div></div></div>
    <div class="cap" id="cap" hidden></div>
    <div class="modal" id="manualDlg" hidden><div class="modal-box" style="width:min(94%,760px);max-height:86vh;display:flex;flex-direction:column"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">How to Play</h2><button id="manualX">Close</button></div><div class="row" id="manualTabs" style="margin:10px 0"></div><div id="manualBody" style="overflow:auto;line-height:1.5"></div></div></div>
    <div class="modal" id="exitDlg" hidden><div class="modal-box"><h2>Exit game?</h2><p id="exitMsg"></p><div class="row"><button class="primary" id="exitYes">Save and exit</button><button id="exitDiscard">Exit without saving</button><button id="exitNo">Keep playing</button></div></div></div>
    <div class="hub-banner" id="hubBanner" hidden></div><div class="banter" id="banter" hidden aria-live="polite"></div><div class="hub-saved" id="hubSaved" hidden>Saved</div>
    <div class="dlg" id="dlg" hidden><div class="dlg-name" id="dlgName"></div><div class="dlg-text" id="dlgText"></div><div class="dlg-next" id="dlgNext" aria-hidden="true">&#9660;</div></div>
    <button class="mini skip" id="skipBtn" tabindex="-1" hidden>Skip scene</button>
  </div>
  <section class="panel" id="menu"></section>
  <section id="battleUI" hidden>
    <div class="tut" id="tut" hidden></div>
    <div class="tq-row" id="turnOrder" aria-label="Turn order"></div>
    <div class="status" id="status"></div>
    <div class="deck" style="margin-top:10px">
      <div class="cmds"><div class="who" id="who">Ready</div><div class="btns" id="btns"></div></div>
      <div class="log" id="log"></div>
    </div>
  </section>
</div>

<script>
// ================= Sprites (hi-detail) =================
// Hand-placed 24x30 templates with hue-shifted shading, selective colored outlines, and a 2-frame idle.
const clamp01=v=>Math.max(0,Math.min(1,v));
function hexToHsl(hex){const n=parseInt(hex.slice(1),16);let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return [h,s,l]}
function hslToHex(h,s,l){const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function shiftCol(hex,dl,toward,amt,ds){const [h,s,l]=hexToHsl(hex);const d=((toward-h+540)%360)-180;const nh=(h+Math.sign(d)*Math.min(Math.abs(d),amt)+360)%360;return hslToHex(nh,clamp01(s+(ds||0)),clamp01(l+dl))}
const shadeOf=c=>shiftCol(c,-.13,250,16,.04);
const deepOf=c=>shiftCol(c,-.32,255,26,.06);
const hiOf=c=>shiftCol(c,.13,50,12,-.02);

// Letter -> region. Upper = base, lower = shadow, third letter = highlight.
const REGIONS={hair:'HhI',skin:'Ss_',top:'TtU',pants:'Pp_',shoes:'Bb_',armor:'AaL',trim:'DdF',suit:'Kk_',cape:'RrY',acc:'XxZ',visor:'Vv_',gem:'gG_'};
function buildPalette(p){
  const pal={E:'#1a1424',C:'#2a1e1a',W:'#ffffff',M:shadeOf(shadeOf(p.skin||'#e0b090'))};
  for(const r in REGIONS){const c=p[r];if(!c)continue;const [b,s,h]=REGIONS[r];

function grid(){return Array.from({length:H},()=>Array(W).fill('.'))}
function stamp(g,rows,dy){if(!rows)return;rows.forEach((r,y)=>{const yy=y+(dy||0);if(yy<0||yy>=H)return;[...r].forEach((ch,x)=>{if(ch!=='.'&&x<W)g[yy][x]=ch})})}
// Idle frame 2: everything above the waist drops one pixel.
function breathe(g){const o=g.map(r=>r.slice());for(let y=20;y>=1;y--)o[y]=g[y-1].slice();o[0]=Array(W).fill('.');return o}
function toCanvas(g,pal){
  const W=g[0].length,H=g.length;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const img=x.createImageData(W,H);
  const col=Array.from({length:H},()=>Array(W).fill(null));
  for(let y=0;y<H;y++)for(let i=0;i<W;i++){const ch=g[y][i];if(ch!=='.'&&pal[ch])col[y][i]=pal[ch]}
  const put=(i,y,hex)=>{const n=parseInt(hex.slice(1),16),o=(y*W+i)*4;img.data[o]=n>>16&255;img.data[o+1]=n>>8&255;img.data[o+2]=n&255;img.data[o+3]=255};
  for(let y=0;y<H;y++)for(let i=0;i<W;i++){
    if(col[y][i]){put(i,y,col[y][i]);continue}
    // selective outline: darkest neighbor's hue, pushed deep
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>col[y+dy]&&col[y+dy][i+dx]).filter(Boolean);
    if(nb.length)put(i,y,deepOf(deepOf(nb[0])));
  }
  x.putImageData(img,0,0);return c;
}
function tintOf(c,col){const w=document.createElement('canvas');w.width=c.width;w.height=c.height;const x=w.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,w.width,w.height);return w}
function whiteOf(c){const w=document.createElement('canvas');w.width=c.width;w.height=c.height;const x=w.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,w.width,w.height);return w}
function buildKidSprites(id,K){
  const hp=buildPalette(K.humanP),ap=buildPalette(K.armorP);
  const hair=HAIR[id]||{},gear=GEAR[id]||{};
  const h=grid();stamp(h,hair.back);stamp(h,BODY);stamp(h,hair.extra);stamp(h,hair.front);
  const a=grid();stamp(a,gear.back);stamp(a,ARMORT);stamp(a,gear.front);
  const hf=[toCanvas(h,hp),toCanvas(breathe(h),hp)],af=[toCanvas(a,ap),toCanvas(breathe(a),ap)];
  const bare=h.map(r=>r.map(c=>'gGC'.includes(c)?'T':c));const hb=[toCanvas(bare,hp),toCanvas(breathe(bare),hp)];
  return {bare:hb,human:hf,armor:af,humanW:hf.map(whiteOf),armorW:af.map(whiteOf),veil:tintOf(hf[0],'#9aa0ac'),dark:tintOf(af[0],'#3a1a5c')};
}

const bossCanvas=document.createElement('canvas');bossCanvas.width=36;bossCanvas.height=36;const bctx=bossCanvas.getContext('2d');
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
// ---- shading helpers: posterized lighting from the upper left, hue-shifted ramps ----
const LD=[-.55,-.62,.56];
function ramp(c){return [deepOf(c),shadeOf(c),c,hiOf(c),hiOf(hiOf(c))]}
const RAMPS={};const R=c=>RAMPS[c]||(RAMPS[c]=ramp(c));
const lit=l=>l>.86?4:l>.5?3:l>.12?2:l>-.25?1:0;
// shaded ellipsoid; tex(x,y,idx) may return a color to override
// On the HD screen, blobs (trees, bushes, the fountain, rocks...) are drawn at half-pixel detail for smoother curves.
// Plain blobs are cached as small 2x images; textured ones draw their half pixels directly.
const BLOBC=new Map();
function blobHD(cx,cy,rx,ry,col,tex){
  const shadeAt=(u,v)=>{const nx=(u/2+.25)/rx,ny=(v/2+.25)/ry,d=nx*nx+ny*ny;if(d>1)return null;const nz=Math.sqrt(1-d);const i=lit(nx*LD[0]+ny*LD[1]+nz*LD[2]);return (tex&&tex(Math.floor(u/2),Math.floor(v/2),i,nx,ny))||R(col)[i]};
  const X=Math.round(cx),Y=Math.round(cy);
  if(!tex){const k=rx+','+ry+','+col;let c=BLOBC.get(k);
    if(!c){c=document.createElement('canvas');c.width=4*rx;c.height=4*ry;Object.assign(c,{_scale:2,_lw:2*rx,_lh:2*ry});const x=c.getContext('2d');
      for(let v=-2*ry;v<2*ry;v++)for(let u=-2*rx;u<2*rx;u++){const s=shadeAt(u,v);if(s){x.fillStyle=s;x.fillRect(u+2*rx,v+2*ry,1,1)}}BLOBC.set(k,c)}
    ctx.drawImage(c,X-rx,Y-ry);return}
  for(let v=-2*ry;v<2*ry;v++)for(let u=-2*rx;u<2*rx;u++){const s=shadeAt(u,v);if(s){ctx.fillStyle=s;ctx.fillRect(X+u/2,Y+v/2,.5,.5)}}}
function blob(cx,cy,rx,ry,col,tex){
  if(ctx._hd&&rx>0&&ry>0&&Number.isInteger(rx)&&Number.isInteger(ry))return blobHD(cx,cy,rx,ry,col,tex);
  for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++){const nx=(x+.5)/rx,ny=(y+.5)/ry,d=nx*nx+ny*ny;if(d>1)continue;
    const nz=Math.sqrt(1-d);const i=lit(nx*LD[0]+ny*LD[1]+nz*LD[2]);px(cx+x,cy+y,1,1,(tex&&tex(x,y,i,nx,ny))||R(col)[i])}}
// vertical cylinder
function cyl(x0,y0,w,h,col){for(let i=0;i<w;i++){const nx=(i+.5)/w*2-1;const c=R(col)[lit(nx*LD[0]+Math.sqrt(1-nx*nx)*LD[2]-.1)];px(x0+i,y0,1,h,c)}}
// bevelled box: lit top/left, shaded bottom/right
function box(x,y,w,h,col,e){e=e||1;const r=R(col);px(x,y,w,h,r[2]);px(x,y,w,e,r[3]);px(x,y,e,h,r[3]);px(x,y+h-e,w,e,r[1]);px(x+w-e,y,e,h,r[1]);px(x,y,1,1,r[4])}
function lineP(x1,y1,x2,y2,c){if(ctx._hd){const n=(Math.max(Math.abs(x2-x1),Math.abs(y2-y1))||1)*2;ctx.fillStyle=c;for(let i=0;i<=n;i++)ctx.fillRect(Math.round((x1+(x2-x1)*i/n)*2)/2,Math.round((y1+(y2-y1)*i/n)*2)/2,1,1);return}const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))||1;for(let i=0;i<=n;i++)px(x1+(x2-x1)*i/n,y1+(y2-y1)*i/n,1,1,c)}

function drawWraith(b,x0,y0){

  // ribcage torso

  for(let f=0;f<4;f++)lineP(cx-40,cy+16+flex+f,cx-48-f,cy+12+flex+f*3,'#eef6f2');
  for(let w=0;w<3;w++)lineP(cx+10,cy+9+w,cx+24,cy-6+w,w===1?pale:mid);
  for(let f=0;f<4;f++)lineP(cx+24,cy-6+f,cx+28+f,cy-14+f*2,'#eef6f2');
  // skull head with a gaping maw
  blob(cx-4,cy-4,10,12,pale);
  lineP(cx-6,cy-15,cx-3,cy-9,'#5a7a74');lineP(cx+2,cy-14,cx+4,cy-10,'#5a7a74');
  [[cx-10,cy-7],[cx-2,cy-7]].forEach(([ex,ey])=>{px(ex,ey,4,5,dark);px(ex+1,ey+2,2,2,VOID)});
  px(cx-11,cy+2,13,12,dark);for(let x=0;x<13;x+=2){px(cx-11+x,cy+2,1,3,'#f2f6f2');px(cx-10+x,cy+11,1,3,'#f2f6f2')}
  // the broken crown, shards dim and cracked
  ['#8a6a3a','#8a3a4a','#9aa8b8','#3a7a8a'].forEach((c,i)=>{const a=Math.PI*(1.2+i*.2),sx=cx-4+Math.round(Math.cos(a)*13),sy=cy-18+Math.round(Math.sin(a)*4)+Math.round(Math.sin(T/18+i)*2);
    px(sx,sy-1,1,1,c);px(sx-1,sy,3,2,c);px(sx,sy,1,2,dark)});
  ctx.restore();

}

// ================= Turn flow =================
async function slotTurn(i){
  let k=S.slots[i];if(!k||k.down)return;
  S.lastRank=1;
  if(k.caged){log(`${k.name} is trapped in the lantern's cage.`);renderStatus();await sleep(450);return}
  if(k.held){k.held=0;log(`${k.name} breaks free, but loses the turn.`);renderStatus();await sleep(500);return}
  if(k.charm==='lantern')heal(k,4);
  if(k.id==='kaytahn'){if(k.powered){activeAlive().forEach(p=>heal(p,6));log('Riptide Renewal washes over the team.')}else heal(k,4)}
  while(true){
    S.active=k;renderStatus();if(S.ch.hint)S.ch.hint(k);
    const act=await chooseAction(k);
    if(act.swapTo){swapIn(i,act.swapTo);if(S.ch.lonely){k.lonely=0;act.swapTo.lonely=0}k=act.swapTo;continue}
    S.helpFlag=false;const snap=S.ch.lonely?S.roster.filter(p=>p!==k).map(p=>[p,p.hp,p.down,p.barrier,p.guard|0,p.veil,p.cd,p.caged,S.boss.cage?S.boss.cage.hp:0]):null;
    PLOG.act(k,act);S.lastRank=rankOf(act);if(k.watchT&&!act.morph){S.lastRank*=.7;k.watchT=false;log(`Pocket Watch: ${k.name} moves on quick.`)}await act.run();if(S.over)return;
    if(S.transition){await S.transition;S.active=null;renderStatus();return}
    if(snap&&!act.morph){const helped=S.helpFlag||snap.some(([p,hp,dn,ba,gu,ve,cd,cg,ch])=>p.hp>hp||(dn&&!p.down)||(!ba&&p.barrier)||(p.guard|0)>gu||(!ve&&p.veil)||p.cd<cd||(cg&&!p.caged)||(S.boss.cage?S.boss.cage.hp:0)<ch);
      k.lonely=helped?0:(k.lonely|0)+1;if(helped&&kidPos(k))floatText(...kidCenter(k),'Connected','#9fe8c8');renderStatus()}
    if(act.morph){continue}
    if(act.special){S.active=null;renderStatus();return}
    break;
  }
  if(k.powered){k.powered--;if(!k.powered){k.cd=cdFor(k);k.unbreak=false;log(`${k.name}'s armor fades. Cooldown: ${k.cd} turns.`)}}
  else if(k.cd>0)k.cd--;
  if(k.rcd>0)k.rcd--;if(k.guard>0)k.guard--;
  S.active=null;renderStatus();
}
async function bossTurn(){
  if(S.skipBoss){S.skipBoss=false;return}
  const b=S.boss,C=S.ch;b.jabbed=false;lockMenu(`${BN()} is up...`);if(C.hint)C.hint(null);renderStatus();await sleep(450);
  if(b.stun>0){b.stun--;log(C.stunText||`${BN()} can't act.`);if(!b.stun)b.vuln=1}
  else if(b.hesitate){b.hesitate=false;b.vuln=1;log(`${BN()} hesitates and loses the turn.`)}
  else{b.vuln=1;await C.turn(b)}
  if(b.taunt>0)b.taunt--;if(b.hex>0)b.hex--;
  renderStatus();if(S.roster.every(k=>k.down)||(C.party3&&S.roster.some(p=>p.seraph&&p.down))){if(C.scripted)await knightScript();else lose()}
  await sleep(300);
}
function autoReplace(){
  S.slots.forEach((k,i)=>{if(k&&k.down){const nk=benchAlive()[0];if(nk)swapIn(i,nk)}});
}
async function battle(){
  const myState=S;if(!S.round)S.round=1;
  while(!S.over&&S===myState){
    autoReplace();const U=ctbUnits();if(!U.some(u=>!u.boss)){if(!benchAlive().length)lose();return}
    const nx=ctPick(U,ctOf),dt=ctOf(nx);U.forEach(u=>{(u.boss?S.boss:u.k).ct=ctOf(u)-dt});
    if(nx.boss){const b=S.boss;S.cur=3;renderTurnOrder();await bossTurn();if(S.over||S!==myState)return;
      if(S.boss===b){b.ct=delayFor(bossSpd(b,b.slow>0,b.hex>0),1);if(b.slow>0)b.slow--}
      newRound();if(!activeAlive().length&&!benchAlive().length)lose()}
    else{S.cur=nx.slot;renderTurnOrder();await slotTurn(nx.slot);if(S.over||S!==myState)return;
      const k=S.slots[nx.slot];if(k&&!k.down){k.ct=delayFor(kidSpd(k,k.haste>0),S.lastRank||1);if(k.haste>0)k.haste--}}
    S.cur=null;
  }
}
function win(){if(S.over)return;

farewell:{label:"Chapter 12 · Farewell",steps:[
  {bg:'woods',light:'calm',mote:'calm',woods:{red:false,crater:true},music:'tender'},

  {fade:'in',ms:1200},
  {cap:'After the battle. The edge of the crater, where his story and theirs both began.',top:true},
  {say:'aldric',text:'Thank you. You did what I never could. You let each other carry the weight.'},
  {say:'lightheart',text:"We couldn't have done it alone."},
  {say:'aldric',text:"Then listen closely. The shard showed me things, and I don't have long."},
  {say:'aldric',text:'My stone was the sixth light. The Warden. It was never meant to fight. It was meant to hold five lights together.'},
  {say:'aldric',text:'I never found my five. I tried to be all of them, and it broke me. You are the team I should have had.'},
  {say:'aldric',text:'Your stones came from a world called Lumora. They were its lights. The one who burned it is still out there, and he remembers the stones that got away.'},
  {say:'aldric',text:'He never comes all at once. First comes a herald. When you hear his voice, know that his master is listening.'},
  {say:'aldric',text:'This world has guardians of its own, sleeping deep in the ground. Guard it until they wake, then let them guard it.'},
  {say:'aldric',text:"These stones were never meant to last forever. They were meant to be given. When that day comes, don't hold on the way I did."},
  {say:'aldric',text:'If the light ever runs low, go back to where it fell.'},
  {say:'aldric',text:'And you, Lightheart. One day they will look to you to carry it. Don\'t carry it alone.'},
  {move:'nightshade',x:132,ms:900},
  {say:'nightshade',text:"You don't have to carry it anymore. We've got it."},
  {say:'kaytahn',text:'Aldric?'},
  {say:'aldric',text:'See that faint red star? That is what is left of Lumora. Someday you will know why it matters.'},
  {say:'aldric',text:'The stars look just like the night I found my stone. I think I can finally rest.'},
  {fadeActor:'aldric',ms:2600,dust:true},
  {cap:'Aldric passed away at peace, smiling. His shard crumbled into crimson dust that drifted up like sparks.',top:true},
  {cap:'Down in the crater, his empty armor lay still, as if it were standing guard.',top:true},
  {fx:'signal'},
  {cap:'Far out in space, a strange signal flickered once, then went quiet.',top:true},
  {fade:'out',ms:1500}]},

  {bg:'woods',music:'taken',woods:{red:true,crater:true}},{fade:'in',ms:1200},

  if(c==='f'){if(on){water();px(x+2,y+2,12,12,'#8a6a42');px(x+2,y+2,12,2,'#a8845a');px(x+2,y+7,12,1,'#6a4a2a')}else{px(x,y,16,16,'#4a3a2a');px(x+(h*3)%12+1,y+(h*5)%12+1,3,2,'#3a2a1a');px(x+2,y+9,4,1,'#5a4a36')}return}

function buildAreaGround(){const c=document.createElement('canvas');c.width=MW*TS*HD;c.height=MH*TS*HD;Object.assign(c,{_scale:HD,_lw:MW*TS,_lh:MH*TS});

function grantLoot(L){const p=P(),out=[];
  if(L.item){const it=ITEMS[L.item];if((p.items[L.item]||0)<ITEM_CAP){p.items[L.item]=(p.items[L.item]||0)+1;out.push(`a ${it.name}`)}else{p.coins+=it.price;out.push(`${it.price} coins (your ${it.name} pocket is full)`)}}
  if(L.coins){p.coins+=L.coins;out.push(`${L.coins} coins`)}
  if(L.mat){p.mats[L.mat[0]]=(p.mats[L.mat[0]]||0)+L.mat[1];out.push(`${L.mat[1]} ${L.mat[0]}`)}
  saveProgress();updateHubHud();return out.join(' and ')}

 first:{n:1,ch:'ch9',where:'the Old Observatory',kind:'journal',find:'the very first page of a journal',title:'Journal, page one',

 gears:{n:6,ch:'ch5',where:'the Clock Tower',kind:'journal',find:'a journal page that was stuck in the gears',title:'Journal page',

 crack:{n:7,ch:'ch8',where:'the Hollow',kind:'journal',shaky:true,find:'a journal page in shaky handwriting',title:'Journal page',

 gone:{n:8,ch:'ch6',where:'the Town Museum',kind:'clip',find:'a clipping from an exhibit drawer',title:'WHERE HAS THE RED HERO GONE?',
  text:['No sightings in three weeks. The old observatory has been dark since the night of the meteor shower.'],letter:'Please come back. You can rest at our house.',

 mem1:{n:10,part:2,ch:'ch13',where:'Hometown High',kind:'memory',find:'a sliver of crystal that hums when you touch it',title:'Memory: The Tower of Lights',
  text:['Two moons hang over a city of white towers. At the top of the tallest one, five lights burn in a circle around a sixth, a crimson light in the center that holds them together.','Every night, the people climb the stairs just to sit near them. Nobody up there is ever alone.'],

 mem2:{n:11,part:2,ch:'ch14',where:'the Hollow',kind:'memory',find:'a sliver of crystal, warm as a hand',title:'Memory: The Keepers',
  text:['The lights always chose the young. Each keeper was a child who carried one virtue: Hope, Courage, Calm, Making, or Memory.','The Warden stood in the middle and held all five together, so no keeper ever stood alone. Every night they passed the lights between them, so no one held one for too long.'],

  init(){if(this.cv)return;const c=document.createElement('canvas');c.width=512;c.height=288;c.id='encfx';

      for(const tri of (Math.random()<.5?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]])){const cx=(tri[0][0]+tri[1][0]+tri[2][0])/3,cy=(tri[0][1]+tri[1][1]+tri[2][1])/3;

        g.textAlign='center';g.textBaseline='middle';g.font='700 18px "Pixelify Sans", monospace';g.fillStyle='#ffcc33';g.fillText('VS',128+bx,61);
        g.font='700 11px "Pixelify Sans", monospace';g.fillStyle='#fff';g.fillText(name,128+bx,79);if(title){g.font='8px "Pixelify Sans", monospace';g.fillStyle='#c8d0dc';g.fillText(title,128+bx,94)}g.globalAlpha=1;g.textAlign='left';g.textBaseline='alphabetic'};

  },
  hide(){try{const g=this.ctx;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,512,288)}catch(e){}if(this.cv)this.cv.style.display='none';this.active=false;this.skip=false},

  keys(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&/^mk[-_]/.test(k)&&k!=='mk-net-name')o[k]=localStorage.getItem(k)}

  async pack(obj){const txt=JSON.stringify({game:'meteorite-kids',v:1,at:Date.now(),data:obj});const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};

    if(code.startsWith('MKZ1:')){if(!window.DecompressionStream)throw new Error('This browser cannot read compressed codes.');const z=new Blob([raw(code.slice(5))]).stream().pipeThrough(new DecompressionStream('gzip'));txt=await new Response(z).text()}

    const j=JSON.parse(txt);if(!j||j.game!=='meteorite-kids'||!j.data||typeof j.data!=='object')throw new Error("That doesn't look like a Meteorite Kids save code.");return j},
  summary(data){const out=[];for(let i=0;i<3;i++){const v=data['mk-save-slot'+(i+1)];if(!v)continue;try{const d=JSON.parse(v);out.push(`File ${i+1}: ${d.label||'Saved game'}`)}catch(e){}}return out.length?out.join(' · '):'Settings only'},
  status(t,err){const el=$('xferStatus');if(el){el.textContent=t;el.style.color=err?'#ff8a9a':'var(--muted)'}},
  async open(){if(SAVE.active!=null&&!TITLE.active){try{await writeSlot(SAVE.active)}catch(e){}}const box=$('xferDlg');box.hidden=false;sfx('cursor');box.querySelector('h2').textContent='Move saves';

let AUTOSAVE=true;try{AUTOSAVE=localStorage.getItem('mk-autosave')!=='off'}catch(e){}
function toggleAutosave(){AUTOSAVE=!AUTOSAVE;try{localStorage.setItem('mk-autosave',AUTOSAVE?'on':'off')}catch(e){}sfx('cursor');document.querySelectorAll('.autosaveBtn').forEach(b=>b.textContent=`Autosave: ${AUTOSAVE?'On':'Off'}`)}
function autoSave(){if(!AUTOSAVE||SAVE.active==null||!SAVE.ready)return;clearTimeout(SAVE.timer);SAVE.timer=setTimeout(()=>writeSlot(SAVE.active).then(ok=>{if(ok&&HUB.active)HUB.saveFlash=90}),800)}
const _saveProgress=saveProgress;saveProgress=function(){_saveProgress();autoSave()};
const _saveHub=saveHub;saveHub=function(){_saveHub();autoSave()};
setInterval(()=>{if(!TITLE.active&&!document.hidden&&SAVE.active!=null)SAVE.play++},1000);
function applySlot(d){
  Object.keys(progress).forEach(k=>delete progress[k]);Object.assign(progress,d?JSON.parse(JSON.stringify(d.progress||{})):{});
  Object.keys(HUB.state).forEach(k=>delete HUB.state[k]);Object.assign(HUB.state,d?JSON.parse(JSON.stringify(d.hub||{})):{});
  _saveProgress();_saveHub();SAVE.play=d?d.play||0:0;
  HUB.map=null;HUB.area=null;HUB.mapArea=null;HUB.age='kid';HUB.leader='lightheart';HUB.firstMorning=false;
  if(d&&d.pos){if(d.pos.x&&d.pos.y){HUB.map=townMap();HUB.x=d.pos.x;HUB.y=d.pos.y;if(d.pos.area&&AREAS[d.pos.area]){HUB.area=d.pos.area;HUB.map=null}}HUB.age=d.pos.age||'kid';if(d.pos.leader)HUB.leader=d.pos.leader}
}
function fmtPlay(s){s=s||0;const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`}
function fmtDate(t){if(!t)return '';const d=new Date(t);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function slotCard(i){const d=SAVE.slots[i];
  if(!d)return `<button id="slot-${i}" class="slot empty">File ${i+1}<small>Empty</small></button>`;
  return `<button id="slot-${i}" class="slot">File ${i+1}${SAVE.active===i?' · current':''}<small>${d.label}</small><small>Chapters cleared ${d.cleared||0} · Fragments ${d.shards||0}/5 · Play time ${fmtPlay(d.play)}</small><small>Saved ${fmtDate(d.savedAt)}</small></button>`}
// mode: 'new' | 'load' | 'save'
function openSlots(mode,back){
  SAVE.mode=mode;SAVE.back=back;if(HUB.active){HUB.saving=true;HUB.keys={};HUB.target=null}
  const title={new:'New Game · choose a file',load:'Load Game',save:'Save Game'}[mode];
  const where=SAVE.cloud?'Saved to your Claude account, so it follows you to any device.':'Saved in this browser.';
  $('menu').innerHTML=`<h2>${title}</h2><p class="tip">${mode==='new'?'Pick a file for your new adventure. A used file will be overwritten.':mode==='save'?'Pick a file to save to. Your current file also saves automatically after every chapter.':'Pick a file to continue.'} ${where}</p>
   <div class="slots">${[0,1,2].map(slotCard).join('')}</div><p id="slotMsg" class="tip"></p><div class="row"><button id="slotBack">Back</button></div>`;
  [0,1,2].forEach(i=>{const b=$('slot-'+i);if(mode==='load'&&!SAVE.slots[i])b.disabled=true;b.onclick=()=>slotPick(i)});
  $('slotBack').onclick=closeSlots;
}
function closeSlots(){SAVE.mode=null;HUB.saving=false;const b=SAVE.back;SAVE.back=null;if(b)b()}
async function slotPick(i){
  const mode=SAVE.mode,msg=$('slotMsg');
  if((mode==='new'||mode==='save')&&SAVE.slots[i]&&SAVE.active!==i&&SAVE.confirm!==i){SAVE.confirm=i;msg.textContent=`File ${i+1} already has a save. Press it again to overwrite.`;sfx('cancel');return}
  SAVE.confirm=null;
  if(mode==='save'){msg.textContent='Saving...';SAVE.active=i;const ok=await writeSlot(i);sfx(ok?'heal':'cancel');msg.textContent=ok?`Saved to File ${i+1}.`:'Saved in this browser only. Your account save could not be reached.';
    [0,1,2].forEach(j=>{const b=$('slot-'+j);if(b)b.outerHTML=slotCard(j)});[0,1,2].forEach(j=>{const b=$('slot-'+j);if(b)b.onclick=()=>slotPick(j)});return}
  if(mode==='new'){applySlot(null);SAVE.active=i;await writeSlot(i)}
  else{applySlot(SAVE.slots[i]);SAVE.active=i;try{localStorage.setItem('mk-active-slot',JSON.stringify(i))}catch(e){}}
  SAVE.mode=null;HUB.saving=false;sfx('confirm');TITLE.active=false;startGame();
}
function mostRecentSlot(){let best=-1,t=-1;SAVE.slots.forEach((d,i)=>{if(d&&(d.savedAt||0)>t){t=d.savedAt||0;best=i}});return best}

// ================= Player manual =================
const MANUAL={open:false,tab:'start'};
function manualHeroes(){
  const H={
    lightheart:{stone:'dark blue',role:'Leader and team engine',hp:'Balanced',passive:'<b>Inspire:</b> when Jake lands a hit, the friend with the longest morph cooldown gets 1 turn shaved off (once a round).',skill:"<b>Focus Strike:</b> a heavier hit that powers Inspire. <i>After Chapter 5 it grows into <b>Leader's Focus</b> and also cuts a friend's morph cooldown.</i>",pp:'<b>Unbreakable:</b> while he is morphed, the first hit that would knock a friend out leaves them at 1 HP instead.',moves:'<b>Starfall Blade</b> (huge single hit) and <b>Rally Cry</b> (all cooldowns −1 and a small team heal).'},
    scareth:{stone:'black',role:'Fast hitter and disruptor',hp:'Lower HP, high Attack',passive:'<b>Unnerving Presence:</b> his hits can make the enemy hesitate and lose its turn.',skill:'<b>Quick Jab:</b> a fast strike that comes back quick and knocks the boss back in line. <i>After Chapter 2 it grows into <b>Phantom Jab</b> and knocks the boss twice as far.</i>',pp:'<b>Dread Aura:</b> every hit shakes the enemy, weakening its attacks (stacks up to 3).',moves:'<b>Shadow Rend</b> (three hits) and <b>Phantom Veil</b> (a friend dodges the next attack).'},
    kaytahn:{stone:'teal',role:'Healer and support',hp:'Balanced, high Magic',passive:'<b>Calm Waters:</b> Lindsey heals herself a little at the start of each of her turns.',skill:'<b>Mend:</b> heals the most hurt friend, or revives a knocked-out one. <i>After Chapter 3 it grows into <b>Tidal Mend</b>: revived friends come back stronger, and whoever she mends acts sooner.</i>',pp:'<b>Riptide Renewal:</b> the whole team heals a little at the start of each of her turns.',moves:'<b>Undertow</b> (big water hit) and <b>Crest Barrier</b> (shields the whole team).'},
    thornforge:{stone:'dark green',role:'Tank and blacksmith',hp:'Highest HP',passive:'<b>Tinker:</b> the whole team deals +10% damage while Josh is standing, even from the bench.',skill:"<b>Reforge:</b> re-arms every disarmed friend. <i>After Chapter 4 it grows into <b>Master Reforge</b>: always usable, and it heats up friends' next hits.</i>",pp:'<b>Reinforced Plate:</b> he takes 25% less damage.',moves:'<b>Anvil Guard</b> (draws every attack to him for 2 turns) and <b>Temper</b> (friends\' next physical hit +60%).'},
    nightshade:{stone:'dark purple',role:'Dark magic and curses',hp:'Low HP, highest Magic',passive:'<b>Hex Sight:</b> her hits can hex the enemy, so it takes +20% damage for 2 turns.',skill:'<b>Shadow Bolt:</b> dark magic with a good hex chance. <i>After Chapter 9 it grows into <b>Binding Bolt</b> and also slows the boss.</i>',pp:'<b>Deep Hex:</b> every hit applies the hex.',moves:'<b>Hexfire</b> (heavy dark magic) and <b>Void Hold</b> (the enemy loses its next turn, once per morph).'}};
  const ids=HERO_IDS.filter(heroUnlocked);
  return ids.map(id=>{const K=KIDS[id],h=H[id];return `<h3>${K.kid} · ${K.name} <small style="color:var(--muted)">(${h.stone} stone)</small></h3>
    <p><b>${h.role}.</b> ${h.hp}.</p><ul><li>${h.passive}</li><li>${h.skill}</li><li>Morphed: ${h.pp}</li><li>Morphed moves: ${h.moves}</li></ul>`}).join('')
    +(ids.length<5?`<p class="tip">${5-ids.length===1?'One more friend joins':'More friends join'} as the story goes on.</p>`:'');
}
const MANUAL_TABS=[
 ['start','Getting started',()=>`
  <p>Five kids find glowing stones from a lost world called Lumora, and the stones let them morph into armored heroes. Explore your hometown, talk to people, and follow the yellow arrow to where trouble is brewing. Step inside to start each chapter, and grow stronger along the way.</p>
  <h3>Starting out</h3><ul><li><b>New game</b> asks you to pick one of three save files.</li><li><b>Continue</b> picks up your most recent file.</li><li>Sound starts after your first click or key press.</li></ul>
  <h3>Controls</h3><ul>
   <li><b>Keyboard:</b> arrow keys or WASD to move and choose, Enter or Space to confirm, Esc to go back.</li>
   <li><b>Mouse or touch:</b> click buttons, and tap where you want to walk in town.</li>
   <li><b>Xbox controller:</b> D-pad or left stick to move, A to confirm, B to go back, Start to begin or skip, the View button to open Exit.</li>
   <li><b>In town:</b> Tab, Q, or X/Y changes your hero. Esc or Start opens the exit menu.</li>
   <li><b>Story scenes:</b> Enter, Space, or a click moves the dialogue along. Skip scene jumps to the end.</li></ul>`],
 ['battle','Battle basics',()=>`
  <p>Battles are turn-based, with no timing or reflexes needed. Turns follow <b>speed</b>: faster characters come up more often, so Joseph and Tricia can act twice before slow and sturdy Josh acts once. Every action has a weight too. Light moves like Quick Jab and items bring your next turn back sooner, and heavy moves like Starfall Blade, Hexfire, Undertow, and Meteor Strike push it back. Morphing and swapping are free.</p>
  <h3>On your turn</h3><ul>
   <li><b>Attack:</b> a basic hit.</li>
   <li><b>Skill:</b> each kid has a signature human-form move (see Heroes).</li>
   <li><b>Morph:</b> become your armored hero (see Morphing).</li>
   <li><b>Item:</b> use something from your pocket. This takes the turn.</li>
   <li><b>Swap:</b> tag in a friend from the bench. This does <i>not</i> use the turn, so the new kid acts right away.</li></ul>
  <h3>Good to know</h3><ul>
   <li>The <b>Turn order</b> strip above the cards shows who acts next. Point at an action (or move to it with the keyboard or controller) and the strip shows where your next turn will land, marked with a dashed outline. Turns that will be lost (stunned, hesitating, held, or caged) show crossed out.</li>
   <li><b>Changing the order:</b> Quick Jab knocks the boss back in line. Undertow slows the boss for 2 turns. Hexed bosses move a little slower. Rally Cry gives the team Haste for 2 turns. A Quick Snack makes your next turn come up almost right away.</li>
   <li>Every boss has a trick. The tip before each fight and the chips on the boss card tell you what to watch.</li>
   <li><b>Warnings:</b> one turn before a boss (or a squad of enemies) uses a big attack, a red ⚠ Next chip appears on its card and its turn glows red in the Turn order strip. That is your cue to shield, heal, or knock it back in line with Quick Jab or Undertow.</li>
   <li><b>Difficulty:</b> Story, Normal, or Hard. Change it any time from the title menu or the town panel. It sets how tough bosses and enemies are.</li>
   <li>A kid at 0 HP is knocked out. Lindsey's Mend or a Band-Aid brings them back.</li>
   <li>Benched kids rest. Their morph cooldowns tick down while they wait.</li>
   <li>When a kid on the field goes down, a benched friend steps in automatically. If everyone is knocked out, the battle is lost, and you can try again right away.</li></ul>`],
 ['morph','Morphing',()=>`
  <p>Morphing is the heart of every fight. Most bosses can't be beaten without it.</p>
  <ul>
   <li><b>Morph</b> turns a kid into their hero form for <b>3 turns</b>. Morphing doesn't use the turn, so they act right away with stronger moves and a powered passive.</li>
   <li>When the armor fades, that kid has a <b>4-turn cooldown</b> before they can morph again.</li>
   <li>Swapping a morphed kid to the bench ends their morph early.</li>
   <li><b>Meteor Strike:</b> when all three kids on the field are morphed at once, a special command appears. The three stones combine for a massive hit, and all three morphs end.</li></ul>
  <p class="tip">Plan your morphs together. Lining up three at once for Meteor Strike is often how big fights are won.</p>`],
 ['heroes','Heroes',()=>manualHeroes()],
 ['grow','Levels and items',()=>`
  <h3>Levels</h3><ul>
   <li>Every win gives XP to the <b>whole team</b>, including benched kids, so nobody falls behind.</li>
   <li>Each level raises HP, Attack, and Magic, and you <b>pick one extra boost</b> (+8 HP, +2 Attack, or +2 Magic).</li>
   <li>At <b>Levels 4 and 8</b>, each kid's passive gets stronger.</li>
   <li>Bosses are tuned for the level the story expects, so you never <i>have</i> to grind. Extra fights just make things easier.</li></ul>
  <h3>Items</h3><p>Buy them at the Corner Store with coins from battles. You can carry up to 3 of each.</p><ul>
   ${Object.values(ITEMS).map(it=>`<li><b>${it.name}</b> (${it.price} coins): ${it.desc}.</li>`).join('')}</ul>
  <h3>Rewards</h3><ul><li>Bosses give coins and a crafting material the first time you beat them. Replays give smaller rewards.</li></ul>`],
 ['gear','Gear and the forge',()=>`
  <p>After Chapter 4, Josh's workshop at the Old Forge opens. Bring him materials from bosses and patrols plus some coins, and he'll make gear.</p>
  <ul>
   <li><b>Weapon:</b> three upgrades that raise each kid's main stat (Attack for Jake, Joseph, and Josh; Magic for Lindsey and Tricia).</li>
   <li><b>Outfit:</b> three upgrades that add HP.</li>
   <li><b>Charm:</b> one-of-a-kind special effects. Craft a charm once, then hand it to whoever needs it.</li></ul>
  <h3>Charms</h3><ul>${Object.values(CHARMS).filter(c=>!c.found).map(c=>`<li><b>${c.name}:</b> ${c.desc}.</li>`).join('')}</ul><p>Every dungeon also hides one <b>gold box</b> off the main path. Each holds a one-of-a-kind charm you can't craft, plus a page of the Red Hero's story for your Scrapbook (on the Party screen).</p>
  <p class="tip">The forge shows what each recipe needs. Anything you're short on is shown in red.</p>`],
 ['town','Hometown',()=>`
  <ul>
   <li><b>Choose your hero:</b> pick who you walk around as. Change anytime with the Change hero button.</li>
   <li><b>Doors and signs</b> lead into chapters. Places you aren't ready for yet stay closed until the story gets there.</li>
   <li><b>Talk to everyone.</b> Townspeople have different things to say to each kid.</li>
   <li><b>Puzzles:</b> each kid's everyday power solves a different problem around town, and each one rewards a meteor fragment. If the wrong kid tries, you'll get a hint.</li>
   <li><b>Ashling patrols</b> march on the edges of town. Walk into one to fight, or walk around it. Sneak up from behind for an <b>ambush</b>, and they lose their first turn. Beaten patrols return after you play a story chapter.</li>
   <li><b>Corner Store</b> sells items. <b>The Old Forge</b> makes gear. <b>Party</b> shows each kid's level, stats, and gear, lets you swap charms, and sets your <b>battle lineup</b> (who starts each fight and who waits on the bench).</li>
   <li><b>Era:</b> switch between the kids, teens, and adults versions of town to see who's around.</li></ul>`],
 ['explore','Dungeons and powers',()=>`
  <p>Each chapter's trouble spot is a short dungeon: a few rooms joined by doorways, with puzzles, prize boxes, enemies you can see, and the boss at the end. Walk through a doorway to go to the next room. A meteor crystal near the boss lets you save first.</p>
  <h3>Field powers</h3><p>Outside of battle, each kid has a power. Walk up to something that looks out of place and press Talk / use. If it needs someone else, press Change hero and try again.</p><ul>
   <li><b>Jake, Glow:</b> lights up dark rooms and reveals hidden paths.</li>
   <li><b>Joseph, Shadow Step:</b> blinks through a deep shadow to the other side of bars and gaps.</li>
   <li><b>Lindsey, Tide:</b> douses fires, fills basins, and waters vines.</li>
   <li><b>Josh, Heave:</b> pushes heavy things aside and repairs broken ones.</li>
   <li><b>Tricia, Hex Hand:</b> reads runes, opens magic seals, and moves things from a distance.</li></ul>
  <h3>Good to know</h3><ul><li>Some secrets need a power you don't have yet. Come back later with the right friend.</li><li>Enemies roam the rooms. Walk into them to fight, or sneak up from behind for an ambush. Beaten enemies stay down until you leave the dungeon.</li><li>After you beat a chapter, you can go back in to explore and find anything you missed.</li><li>Puzzles don't tell you who to use. Try a power; if it is the wrong kid, the game hints, and the second time it says who. Some puzzles take two powers in a row.</li><li>Turn the guide arrow off from the panel if you'd rather find your own way.</li></ul>`],
 ['save','Saving',()=>`
  <ul>
   <li>There are <b>three save files</b>. Each one shows your next chapter, chapters cleared, fragments, play time, and when it was saved.</li>
   <li><b>Autosave</b> (on by default) saves whenever you clear a chapter, solve a puzzle, change heroes, or buy something. You can turn it off on the title screen or in town.</li>
   <li><b>Save by hand</b> in town with the Save button or the glowing Meteor Crystal by the fountain. This also remembers exactly where you're standing.</li>
   <li><b>Exit</b> (top bar) lets you <b>Save and exit</b> or <b>Exit without saving</b>. Leaving in the middle of a battle starts that battle over next time.</li></ul>`]];
function renderManual(){
  $('manualTabs').innerHTML=MANUAL_TABS.map(([id,l])=>`<button id="mt-${id}" ${id===MANUAL.tab?'class="primary"':''}>${l}</button>`).join('');
  MANUAL_TABS.forEach(([id])=>$('mt-'+id).onclick=()=>{MANUAL.tab=id;renderManual();sfx('cursor')});
  const t=MANUAL_TABS.find(x=>x[0]===MANUAL.tab);$('manualBody').innerHTML=t[2]();$('manualBody').scrollTop=0;
}
function openManual(){MANUAL.open=true;HUB.keys={};HUB.pad=[0,0];renderManual();$('manualDlg').hidden=false;sfx('cursor')}
function closeManual(){MANUAL.open=false;$('manualDlg').hidden=true}
$('manualBtn').onclick=()=>MANUAL.open?closeManual():openManual();$('manualX').onclick=closeManual;
document.addEventListener('keydown',e=>{if(!MANUAL.open)return;if(e.key==='Escape'){e.preventDefault();closeManual()}
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const i=MANUAL_TABS.findIndex(x=>x[0]===MANUAL.tab),n=MANUAL_TABS.length;MANUAL.tab=MANUAL_TABS[(i+(e.key==='ArrowRight'?1:n-1))%n][0];renderManual()}
  e.stopImmediatePropagation()},true);

// ================= Exit =================
// A web page can't close its own tab, so Exit saves your file and returns to the title screen.
function openExit(){
  if(TITLE.active||!$('exitDlg').hidden)return;
  const midBattle=!$('battleUI').hidden&&S&&!S.over;
  const fn=SAVE.active!=null?`File ${SAVE.active+1}`:'your file';$('exitMsg').innerHTML=`<strong>Save and exit</strong> saves where you are to ${fn}. <strong>Exit without saving</strong> leaves ${fn} as it was at its last save. ${AUTOSAVE?"With autosave on, chapters you've cleared are already saved.":'Autosave is off, so anything since your last save will be lost.'}${midBattle?' This battle will start over next time.':''} Either way, you'll go back to the title screen.`;
  HUB.keys={};HUB.pad=[0,0];EXIT.open=true;$('exitDlg').hidden=false;sfx('cursor');setTimeout(()=>{if(navMode!=='mouse')setFocus($('exitNo'),true)},0);
}
const EXIT={open:false};
function closeExit(){$('exitDlg').hidden=true;EXIT.open=false}
async function doExit(){
  $('exitYes').disabled=true;$('exitMsg').textContent='Saving...';
  if(SAVE.active!=null){clearTimeout(SAVE.timer);await writeSlot(SAVE.active)}
  location.reload();
}
$('exitBtn').onclick=openExit;$('exitYes').onclick=doExit;$('exitNo').onclick=closeExit;
$('exitDiscard').onclick=()=>{clearTimeout(SAVE.timer);SAVE.active=null;location.reload()};
setInterval(()=>{$('exitBtn').hidden=TITLE.active},250);

S=newState(CHAPTERS[0]);S.over=true;showTitle();render();saveInit();
$('soundBtn').onclick=()=>{unlockAudio();toggleSound()};$('skipBtn').onclick=e=>{e.stopPropagation();cutSkip()};$('screen').addEventListener('click',e=>{if(TITLE.active){if(!TITLE.pressed)titlePress();return}if(CUT.active){cutAdvance();return}
  if(HUB.active){if(HUB.saving)return;if(HUB.talking){hubAdvance();return}if(HUB.choosing){const r=$('cv').getBoundingClientRect();const i=Math.max(0,Math.min(4,Math.floor(((e.clientX-r.left)*256/r.width-8)/48)));if(!heroUnlocked(PARTY_ORDER[i]))return;if(i===HUB.pick)pickHero(PARTY_ORDER[i]);else{HUB.pick=i;sfx('cursor')}return}const r=$('cv').getBoundingClientRect();if(e.clientY>r.bottom)return;
    const wx=(e.clientX-r.left)*256/r.width+HUB.cam[0],wy=(e.clientY-r.top)*144/r.height+HUB.cam[1];
    let hit=null,hd=16;OBJS.forEach(o=>{const ox=o.tx*TS+8,oy=o.ty*TS+(o.type==='door'?-6:6);const d=Math.hypot(ox-wx,oy-wy);if(d<hd){hd=d;hit=o}});
    if(hit&&HUB.near===hit){hubInteract(hit);return}
    HUB.target=hit?{x:hit.tx*TS+8,y:hit.ty*TS+(hit.type==='door'?10:24),obj:hit}:{x:wx,y:wy}}});updateSoundBtn();pollPad();
</script>
